seed: 20260806
device: cuda

data:
  processed_root: data/processed/ellipticpp
  transaction_edges: data/raw/ellipticpp/Transactions Dataset/txs_edgelist.csv

split:
  train: [1, 30]
  validation: [31, 35]
  test: [36, 49]

models:
  - gcn
  - gat
  - hgnn
  - evolvegcn_o
  - hgt
  - graph_transformer
  - gat_resnet
  - heterosage
  - bf_hgn

model:
  hidden_dim: 64
  dropout: 0.30
  propagation_layers: 2
  attention_heads: 4
  bf_hgn:
    rgcn_layers: 2
    window_size: 5
    windows_per_epoch: 10
    max_epochs: 60
    patience: 10
    supervision_mode: supervised
    pseudo_anomaly_ratio: 0.20
    loss_mix: 0.30
    affinity_margin: 0.70
    noise_mean: 0.015
    noise_std: 0.005

training:
  max_epochs: 60
  patience: 10
  min_delta: 0.0001
  snapshots_per_step: 5
  learning_rate: 0.001
  weight_decay: 0.0001
  gradient_clip_norm: 5.0
  primary_metric: average_precision

output_root: artifacts/main_experiment/baselines/seed_20260806
